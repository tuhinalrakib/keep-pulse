<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <linearGradient id="cyanPurpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="50%" stop-color="#4facfe" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="pulseGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="24" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer Rounded Shield Container -->
  <rect x="32" y="32" width="448" height="448" rx="96" fill="url(#bgGrad)" stroke="rgba(255, 255, 255, 0.12)" stroke-width="6" />

  <!-- Ambient Glow Circle -->
  <circle cx="256" cy="256" r="160" fill="#00f2fe" opacity="0.15" filter="url(#pulseGlow)" />

  <!-- Pulse Heartbeat Electrocardiogram Line -->
  <path d="M 96 256 H 180 L 210 180 L 240 330 L 280 140 L 320 290 L 345 235 L 370 256 H 416" 
        fill="none" 
        stroke="url(#cyanPurpleGrad)" 
        stroke-width="22" 
        stroke-linecap="round" 
        stroke-linejoin="round" 
        filter="url(#glow)" />

  <!-- Central Sentinel Lightning Overlay -->
  <path d="M 265 110 L 205 260 H 260 L 245 402 L 315 242 H 260 Z" 
        fill="url(#cyanPurpleGrad)" 
        opacity="0.9" 
        filter="url(#glow)" />
</svg>
